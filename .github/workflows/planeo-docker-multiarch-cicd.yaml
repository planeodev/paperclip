# planeodev fork only (not for upstream): builds ghcr.io/planeodev/paperclip with the shared Vionix pipeline
# (ohanalabs-ai/github-platform), the way every planeodev image is built (planeo-infra CLAUDE.md §9):
#   - every PR → a PR image (pr/<N>), deleted with the PR;
#   - push to planeo/main (a merge) → the <branch>-<sha7> image the customers repo pins on each Paperclip Instance.
# amd64 only: planeo-prod's Karpenter pools are amd64, and an emulated arm64 build of this monorepo takes hours.
name: 🐳 planeo docker-multiarch-cicd
run-name: 🐳 paperclip image — ${{ github.event_name }} ${{ github.event.pull_request.number && format('PR {0}', github.event.pull_request.number) || github.ref_name }} ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [planeo/main]
  workflow_dispatch:

jobs:
  docker-multiarch:
    name: 🐳 docker
    uses: ohanalabs-ai/github-platform/.github/workflows/docker-multiarch-cicd.yaml@main
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      pull-requests: write
    with:
      registry: ghcr.io
      platforms: linux/amd64
      docker-compose-file-name: docker-compose.yaml
      docker-compose-target-service: paperclip
      push-attestations: false
